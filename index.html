<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE DA 2026 Daily Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --pending: #f59e0b;
            --progress: #3b82f6;
            --completed: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        .btn-add {
            background-color: var(--completed);
        }

        .table-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #0f172a;
            color: var(--accent-color);
        }

        tr:hover {
            background-color: #26334d;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }

        .status-pending { background-color: rgba(245, 158, 11, 0.2); color: var(--pending); border: 1px solid var(--pending); }
        .status-progress { background-color: rgba(59, 130, 246, 0.2); color: var(--progress); border: 1px solid var(--progress); }
        .status-completed { background-color: rgba(16, 185, 129, 0.2); color: var(--completed); border: 1px solid var(--completed); }

        .btn-action {
            padding: 4px 8px;
            margin-right: 4px;
            font-size: 0.8em;
        }

        .btn-delete { background-color: #ef4444; }
        .btn-delete:hover { background-color: #dc2626; color: white; }

        .editable-cell {
            outline: none;
            padding: 4px;
            border-radius: 4px;
        }

        .editable-cell:focus {
            background-color: #334155;
            border: 1px solid var(--accent-color);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GATE DA 2026 Target Tracker</h1>
        <div class="actions">
            <button class="btn-add" onclick="openModal()">+ Add Target</button>
            <button onclick="exportCSV()">Export CSV</button>
        </div>
    </header>

    <div class="table-container">
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>Check</th>
                    <th>Date</th>
                    <th>Day</th>
                    <th>Phase</th>
                    <th>Main Target (6:30 PM - 9:00 PM)</th>
                    <th>Night Target (10:00 PM - 11:30 PM)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows injected by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal for adding new target -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h2>Add Target Row</h2>
        <div class="form-group">
            <label>Date</label>
            <input type="text" id="newDate" placeholder="e.g. 01-Dec-2026">
        </div>
        <div class="form-group">
            <label>Day</label>
            <input type="text" id="newDay" placeholder="e.g. Tue">
        </div>
        <div class="form-group">
            <label>Phase</label>
            <input type="text" id="newPhase" placeholder="e.g. Revision & Mock">
        </div>
        <div class="form-group">
            <label>Main Target</label>
            <input type="text" id="newMain" placeholder="Target Topic">
        </div>
        <div class="form-group">
            <label>Night Target</label>
            <input type="text" id="newNight" placeholder="Night Topic">
        </div>
        <button class="btn-add" onclick="addRow()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

        ["25-Nov-2026","Wed","Revision & Mock","ML Unsupervised Learning + Metrics Rapid Revision","ML GATE PYQs Sprint (20 Questions)","Pending"],
        ["26-Nov-2026","Thu","Revision & Mock","AI Search + Logic & Knowledge Rep Rapid Revision","AI GATE PYQs Sprint (20 Questions)","Pending"],
        ["27-Nov-2026","Fri","Revision & Mock","General Aptitude Full Revision (Verbal, Quant, Spatial)","Full Aptitude Mock Test","Pending"],
        ["28-Nov-2026","Sat","Revision & Mock","FULL-LENGTH SUBJECT TEST 2: ML & AI","Test Analysis & Weak Area Fixes","Pending"],
        ["29-Nov-2026","Sun","Revision & Mock","Leftover Topics / Buffer Clearing Day","Complete Error Log Review","Pending"],
        ["30-Nov-2026","Mon","Revision & Mock","MILESTONE DAY: Short Notes Finalization for Dec Mock Tests","Rest & Strategy Planning for Dec/Jan","Pending"]

    let scheduleData = JSON.parse(localStorage.getItem('gateSchedule')) || initialData;

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        scheduleData.forEach((row, index) => {
            const tr = document.createElement('tr');
            
            const isChecked = row[5] === 'Completed';
            const statusClass = row[5] === 'Completed' ? 'status-completed' : (row[5] === 'In Progress' ? 'status-progress' : 'status-pending');

            tr.innerHTML = `
                <td><input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck(${index}, this.checked)"></td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 0, this.innerText)">${row[0]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 1, this.innerText)">${row[1]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 2, this.innerText)">${row[2]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 3, this.innerText)">${row[3]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 4, this.innerText)">${row[4]}</td>
                <td><span class="status-badge ${statusClass}" onclick="cycleStatus(${index})">${row[5]}</span></td>
                <td>
                    <button class="btn-action btn-delete" onclick="deleteRow(${index})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        saveData();
    }

    function toggleCheck(index, isChecked) {
        scheduleData[index][5] = isChecked ? 'Completed' : 'Pending';
        renderTable();
    }

    function cycleStatus(index) {
        const current = scheduleData[index][5];
        if (current === 'Pending') scheduleData[index][5] = 'In Progress';
        else if (current === 'In Progress') scheduleData[index][5] = 'Completed';
        else scheduleData[index][5] = 'Pending';
        renderTable();
    }

    function updateData(rowIndex, colIndex, value) {
        scheduleData[rowIndex][colIndex] = value;
        saveData();
    }

    function deleteRow(index) {
        if(confirm('Are you sure you want to delete this target?')) {
            scheduleData.splice(index, 1);
            renderTable();
        }
    }

    function openModal() {
        document.getElementById('addModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('addModal').style.display = 'none';
    }

    function addRow() {
        const date = document.getElementById('newDate').value || 'N/A';
        const day = document.getElementById('newDay').value || 'N/A';
        const phase = document.getElementById('newPhase').value || 'General';
        const main = document.getElementById('newMain').value || 'No Target';
        const night = document.getElementById('newNight').value || 'No Target';

        scheduleData.push([date, day, phase, main, night, 'Pending']);
        renderTable();
        closeModal();

        document.getElementById('newDate').value = '';
        document.getElementById('newDay').value = '';
        document.getElementById('newPhase').value = '';
        document.getElementById('newMain').value = '';
        document.getElementById('newNight').value = '';
    }

    function saveData() {
        localStorage.setItem('gateSchedule', JSON.stringify(scheduleData));
    }

    function exportCSV() {
        let csvContent = "data:text/csv;charset=utf-8,Date,Day,Phase,Main Target,Night Target,Status\n";
        scheduleData.forEach(row => {
            let rowStr = row.map(e => `"${e}"`).join(",");
            csvContent += rowStr + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "GATE_DA_2026_Schedule.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Initial Render
    renderTable();
</script>

</body>
</html>
