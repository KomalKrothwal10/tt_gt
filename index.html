<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE DA 2026 Complete Planner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --pending: #f59e0b;
            --progress: #3b82f6;
            --completed: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        .btn-add {
            background-color: var(--completed);
        }

        .table-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #0f172a;
            color: var(--accent-color);
            white-space: nowrap;
        }

        tr:hover {
            background-color: #26334d;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            white-space: nowrap;
        }

        .status-pending { background-color: rgba(245, 158, 11, 0.2); color: var(--pending); border: 1px solid var(--pending); }
        .status-progress { background-color: rgba(59, 130, 246, 0.2); color: var(--progress); border: 1px solid var(--progress); }
        .status-completed { background-color: rgba(16, 185, 129, 0.2); color: var(--completed); border: 1px solid var(--completed); }

        .btn-action {
            padding: 4px 8px;
            font-size: 0.8em;
        }

        .btn-delete { background-color: #ef4444; }
        .btn-delete:hover { background-color: #dc2626; color: white; }

        .editable-cell {
            outline: none;
            padding: 4px;
            border-radius: 4px;
        }

        .editable-cell:focus {
            background-color: #334155;
            border: 1px solid var(--accent-color);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 450px;
            max-width: 90%;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GATE DA 2026 Complete Study Tracker</h1>
        <div class="actions">
            <button class="btn-add" onclick="openModal()">+ Add Target</button>
            <button onclick="exportCSV()">Export CSV</button>
        </div>
    </header>

    <div class="table-container">
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>Check</th>
                    <th>Date</th>
                    <th>Day</th>
                    <th>Phase</th>
                    <th>Morning Revision (7:30 AM - 8:30 AM)</th>
                    <th>Main Target (6:30 PM - 9:00 PM)</th>
                    <th>Night Target (10:00 PM - 11:30 PM)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows injected by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal for adding new target -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h2>Add Target Row</h2>
        <div class="form-group">
            <label>Date</label>
            <input type="text" id="newDate" placeholder="e.g. 01-Dec-2026">
        </div>
        <div class="form-group">
            <label>Day</label>
            <input type="text" id="newDay" placeholder="e.g. Tue">
        </div>
        <div class="form-group">
            <label>Phase / Subject</label>
            <input type="text" id="newPhase" placeholder="e.g. Linear Algebra">
        </div>
        <div class="form-group">
            <label>Morning Revision (1 Hour)</label>
            <input type="text" id="newMorning" placeholder="Formula/Concept Revision">
        </div>
        <div class="form-group">
            <label>Main Target</label>
            <input type="text" id="newMain" placeholder="Core Subject Topic">
        </div>
        <div class="form-group">
            <label>Night Target</label>
            <input type="text" id="newNight" placeholder="Aptitude / Practice Topic">
        </div>
        <button class="btn-add" onclick="addRow()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>

        ["19-Oct-2026","Mon","DSA & Programming","Tree Traversals (Inorder, Preorder, Postorder) Rules","Trees: Binary Trees, BST, Traversals, AVL Trees, Heaps","Aptitude: Data Sufficiency Problems","Pending"],
        ["20-Oct-2026","Tue","DSA & Programming","Graph Traversal Algorithms (BFS vs DFS)","Graphs: Adjacency Matrix/List, BFS, DFS, Shortest Path Algorithms","Logical Reasoning: Coding-Decoding & Series","Pending"],

        ["22-Oct-2026","Thu","DBMS & Warehousing","ER Diagram Cardinality & Conversion Rules","ER Model & Relational Model: Keys, Foreign Keys, Integrity Constraints","Verbal: Sentence Completion & Critical Reasoning","Pending"],

        ["24-Oct-2026","Sat","DBMS & Warehousing","SQL Execution Order & Grouping Rules","SQL: SELECT Queries, Joins, Subqueries, Aggregations, Grouping","Quant Aptitude: Quadratic Equations & Logarithms","Pending"],
        ["25-Oct-2026","Sun","DBMS & Warehousing","Functional Dependency Closure & Candidate Key Steps","Normalization: 1NF, 2NF, 3NF, BCNF, Dependency Preservation","ML Fundamentals Flashcards","Pending"],
        ["26-Oct-2026","Mon","DBMS & Warehousing","OLTP vs OLAP & Dimensional Schema Chart","Data Warehousing: OLTP vs OLAP, Star Schema, Snowflake Schema","Aptitude: Pipes & Cisterns","Pending"],

        ["27-Oct-2026","Tue","Machine Learning","Bias-Variance Tradeoff Equations","ML Intro: Supervised vs Unsupervised, Bias-Variance Tradeoff, Overfitting","Logical Reasoning: Venn Diagrams","Pending"],
        ["28-Oct-2026","Wed","Machine Learning","Linear Regression Normal Equation & Loss Formula","Linear Regression: MSE Loss, Normal Equation, Gradient Descent","Quant Aptitude: Geometry & Mensuration Basics","Pending"],

        ["30-Oct-2026","Fri","Machine Learning","Entropy, Gini Impurity & Information Gain Formulas","Decision Trees, Random Forests, Ensemble Methods (Bagging & Boosting)","Spatial Reasoning Practice","Pending"],
        ["31-Oct-2026","Sat","Machine Learning","SVM Hyperplane & Margin Calculation Rules","Support Vector Machines (SVM): Soft Margin, Kernels, Dual Formulation","Quant Aptitude: Coordinate Geometry","Pending"],
        ["01-Nov-2026","Sun","Machine Learning","KNN Distance Metrics (Euclidean, Manhattan)","K-Nearest Neighbors (KNN), Naive Bayes Classifier, Laplace Smoothing","Weekly Progress Evaluation","Pending"],

        ["05-Nov-2026","Thu","Machine Learning","Confusion Matrix, Precision, Recall, F1, ROC-AUC","Evaluation Metrics: Precision, Recall, F1-Score, ROC-AUC Curves","Quant Aptitude: Probability Distributions Practice","Pending"],

        // --- ARTIFICIAL INTELLIGENCE ---
        ["06-Nov-2026","Fri","Artificial Intelligence","Uninformed Search Space Complexities (BFS/DFS)","AI Search: Uninformed Search (BFS, DFS, Uniform Cost Search)","ML Supervised Learning Formula Sheet","Pending"],
        ["07-Nov-2026","Sat","Artificial Intelligence","A* Search Heuristic Admissibility & Consistency","Informed Search: Heuristic Search, Greedy Best-First, A* Search","DI: Combined Sets Practice","Pending"],
        ["08-Nov-2026","Sun","Artificial Intelligence","Minimax & Alpha-Beta Pruning Rules","Game Trees: Minimax Algorithm, Alpha-Beta Pruning","Weak Concept Deep Dive","Pending"],
        ["09-Nov-2026","Mon","Artificial Intelligence","Propositional Logic Equivalence Laws","Propositional Logic: Truth Tables, Validity, Satisfiability","Logical Reasoning: Cube Cuts & Dice","Pending"],
        ["10-Nov-2026","Tue","Artificial Intelligence","First-Order Logic Quantifiers & CNF Conversion","First-Order Logic (FOL): Quantifiers, Unification, Resolution Inferences","Quant Aptitude: Trigonometry Basics","Pending"],

        // --- FULL REVISION & MOCK TESTS ---
        ["11-Nov-2026","Wed","Revision & Mock","Prob & Stats Formula Flash Sweep","Full Subject Revision: Probability & Statistics + PYQs","Verbal: Idioms & Phrases","Pending"],
        ["12-Nov-2026","Thu","Revision & Mock","Linear Algebra & Calculus Formula Flash Sweep","Full Subject Revision: Linear Algebra & Calculus + PYQs","ML Unsupervised PYQs Solving","Pending"],
        ["13-Nov-2026","Fri","Revision & Mock","DSA Code & Logic Rapid Review","Full Subject Revision: Programming & Data Structures + PYQs","Spatial Reasoning: Paper Cutting","Pending"],
        ["14-Nov-2026","Sat","Revision & Mock","DBMS SQL & Normalization Rapid Review","Full Subject Revision: DBMS & Warehousing + PYQs","Quant Aptitude: Inequalities","Pending"],
        ["15-Nov-2026","Sun","Revision & Mock","ML Supervised & Unsupervised Formula Sweep","FULL-LENGTH SUBJECT TEST 1: Prob, Stats, Linear Alg & Calculus","Formula Recall Session","Pending"],
        ["16-Nov-2026","Mon","Revision & Mock","AI Search & FOL Inference Rules Review","Full Subject Revision: Machine Learning & AI + PYQs","Logical Reasoning: Puzzles & Seating","Pending"],
        ["17-Nov-2026","Tue","Revision & Mock","General Aptitude Quick Formulas & Tricks","Full Subject Revision: General Aptitude + Mock Test","Verbal: Analogy & Classification","Pending"],
        ["18-Nov-2026","Wed","Revision & Mock","GATE DA PYQ Speed Sprint (2014-2024 Topics)","FULL-LENGTH MOCK TEST 1: Full GATE DA Syllabus","Quant Aptitude: Functions & Graphs","Pending"],
        ["19-Nov-2026","Thu","Revision & Mock","Test 1 Error Analysis & Weak Area Fixing","Deep Dive: Error Analysis & Formulas Correction Log","Aptitude Mix Practice","Pending"],
        ["20-Nov-2026","Fri","Revision & Mock","Final Short Notes Index & Strategy Alignment","FULL-LENGTH MOCK TEST 2: Full GATE DA Syllabus","AI Full Formula & Rules Sheet","Pending"]
    ];

    let scheduleData = JSON.parse(localStorage.getItem('gateDABothSubjectsSchedule')) || initialData;

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        scheduleData.forEach((row, index) => {
            const tr = document.createElement('tr');
            
            const isChecked = row[6] === 'Completed';
            const statusClass = row[6] === 'Completed' ? 'status-completed' : (row[6] === 'In Progress' ? 'status-progress' : 'status-pending');

            tr.innerHTML = `
                <td><input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck(${index}, this.checked)"></td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 0, this.innerText)">${row[0]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 1, this.innerText)">${row[1]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 2, this.innerText)">${row[2]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 3, this.innerText)">${row[3]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 4, this.innerText)">${row[4]}</td>
                <td contenteditable="true" class="editable-cell" onblur="updateData(${index}, 5, this.innerText)">${row[5]}</td>
                <td><span class="status-badge ${statusClass}" onclick="cycleStatus(${index})">${row[6]}</span></td>
                <td>
                    <button class="btn-action btn-delete" onclick="deleteRow(${index})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        saveData();
    }

    function toggleCheck(index, isChecked) {
        scheduleData[index][6] = isChecked ? 'Completed' : 'Pending';
        renderTable();
    }

    function cycleStatus(index) {
        const current = scheduleData[index][6];
        if (current === 'Pending') scheduleData[index][6] = 'In Progress';
        else if (current === 'In Progress') scheduleData[index][6] = 'Completed';
        else scheduleData[index][6] = 'Pending';
        renderTable();
    }

    function updateData(rowIndex, colIndex, value) {
        scheduleData[rowIndex][colIndex] = value;
        saveData();
    }

    function deleteRow(index) {
        if(confirm('Are you sure you want to delete this target?')) {
            scheduleData.splice(index, 1);
            renderTable();
        }
    }

    function openModal() {
        document.getElementById('addModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('addModal').style.display = 'none';
    }

    function addRow() {
        const date = document.getElementById('newDate').value || 'N/A';
        const day = document.getElementById('newDay').value || 'N/A';
        const phase = document.getElementById('newPhase').value || 'General';
        const morning = document.getElementById('newMorning').value || 'Formula Revision';
        const main = document.getElementById('newMain').value || 'No Target';
        const night = document.getElementById('newNight').value || 'No Target';

        scheduleData.push([date, day, phase, morning, main, night, 'Pending']);
        renderTable();
        closeModal();

        document.getElementById('newDate').value = '';
        document.getElementById('newDay').value = '';
        document.getElementById('newPhase').value = '';
        document.getElementById('newMorning').value = '';
        document.getElementById('newMain').value = '';
        document.getElementById('newNight').value = '';
    }

    function saveData() {
        localStorage.setItem('gateDABothSubjectsSchedule', JSON.stringify(scheduleData));
    }

    function exportCSV() {
        let csvContent = "data:text/csv;charset=utf-8,Date,Day,Phase/Subject,Morning Revision,Main Target,Night Target,Status\n";
        scheduleData.forEach(row => {
            let rowStr = row.map(e => `"${e}"`).join(",");
            csvContent += rowStr + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "GATE_DA_2026_Full_Syllabus_Schedule.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Initial Render
    renderTable();
</script>

</body>
</html>
